services:
  content:
    image: nginx:alpine
    command: >
      sh -c 'echo "Hello from $$(hostname)" > /usr/share/nginx/html/index.html
      && exec nginx -g "daemon off;"'
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost/"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      replicas: 3
    restart: unless-stopped
    networks:
      - appnet

  load-balancer:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"
    depends_on:
      content:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - appnet

  checker:
    image: curlimages/curl:latest
    command: sh -c 'while true; do curl -fs http://load-balancer/ || echo FAIL; sleep 5; done'
    depends_on:
      - load-balancer
    restart: unless-stopped
    networks:
      - appnet

networks:
  appnet: